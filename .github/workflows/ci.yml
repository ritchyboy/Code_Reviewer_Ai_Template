name: Code Reviewer CI

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # This is the magic block that fixes your folder structure issue
    defaults:
      run:
        working-directory: CodeReviewerAI

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Build
        run: |
          dotnet restore CodeReviewerAI.sln
          dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        # Since we are already inside the CodeReviewerAI folder,
        # we just point to the sub-folder directly.
        run: dotnet test CodeReviewerAI.Tests.Unit --configuration Release --no-build

      - name: Run Reviewer CLI
        run: >
          dotnet run --project CodeReviewerAI/CodeReviewerAI.csproj
          ${{ github.repository_owner }} 
          ${{ github.event.repository.name }} 
          ${{ github.event.pull_request.number }}
        env:
          Gemini__ApiKey: ${{ secrets.GEMINI_API_KEY }}
          GitHub__Token: ${{ secrets.GITHUB_TOKEN }}
